name: "Publish Docker Images and Helm Chart"

on:
  push:
    branches: [ "release/**" ]
  workflow_run:
    workflows: ["Trivy Security Scan", "CodeQL", "Dependabot Updates"]
    types: [completed]
    branches: [ "release/**" ]

jobs:
  publish-backend:
    name: Publish Backend Docker Image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract version from branch
        id: extract-version
        run: |
          if [[ $GITHUB_REF_NAME =~ ^release/(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            # Remove 'v' prefix if present
            VERSION="${VERSION#v}"
            # Add .0 if no patch version exists
            if [[ $VERSION =~ ^[0-9]+\.[0-9]+$ ]]; then
              VERSION="${VERSION}.0"
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata for backend image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.extract-version.outputs.version }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/backend.Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

  publish-frontend:
    name: Publish Frontend Docker Image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract version from branch
        id: extract-version-frontend
        run: |
          if [[ $GITHUB_REF_NAME =~ ^release/(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            # Remove 'v' prefix if present
            VERSION="${VERSION#v}"
            # Add .0 if no patch version exists
            if [[ $VERSION =~ ^[0-9]+\.[0-9]+$ ]]; then
              VERSION="${VERSION}.0"
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata for frontend image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.extract-version-frontend.outputs.version }}

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/frontend.Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  publish-helm:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.12.0

      - name: Package Helm chart
        run: |
          helm package helm-chart/ --destination .

      - name: Push Helm chart to GHCR
        run: |
          helm push mongodhara-*.tgz oci://ghcr.io/${{ github.repository_owner }}