{{- if .Values.backend.enabled }}
{{- /* Validation: AuthZ requires OAuth */ -}}
{{- if and .Values.global.features.authz.enabled (not .Values.ingress.auth.oauth.enabled) }}
{{- fail "ERROR: global.features.authz.enabled=true requires ingress.auth.oauth.enabled=true. Authorization system depends on OAuth authentication." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "mongodhara.backend.labels" . | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mongodhara.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mongodhara.backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mongodhara.backend.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      {{- if .Values.global.features.opaqueIds.autoGenerateKey }}
      initContainers:
        - name: wait-for-opaque-key
          image: busybox:1.36  # Use specific version instead of latest
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.backend.initContainerSecurityContext | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for OPAQUE_ID_ENCRYPTION_KEY to be populated in secret..."
              # Wait for the secret to be mounted and contain the key
              while true; do
                if [ -f /secrets/OPAQUE_ID_ENCRYPTION_KEY ] && [ -s /secrets/OPAQUE_ID_ENCRYPTION_KEY ]; then
                  echo "OPAQUE_ID_ENCRYPTION_KEY found in mounted secret, proceeding..."
                  break
                fi
                echo "OPAQUE_ID_ENCRYPTION_KEY not yet available, waiting..."
                sleep 5
              done
          volumeMounts:
            - name: opaque-key-secret
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      {{- end }}
      containers:
        - name: backend
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          image: {{ include "mongodhara.backend.image" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
          {{- if .Values.global.features.opaqueIds.autoGenerateKey }}
          volumeMounts:
            - name: opaque-key-secret
              mountPath: /secrets
              readOnly: true
          {{- end }}
          env:
            {{- if .Values.backend.mongoUri.secretRef.enabled }}
            # MONGO_URI from secret
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.mongoUri.secretRef.secretName }}
                  key: {{ .Values.backend.mongoUri.secretRef.key }}
            {{- else if .Values.backend.mongoUri.value }}
            # MONGO_URI from direct value
            - name: MONGO_URI
              value: {{ .Values.backend.mongoUri.value | quote }}
            {{- end }}
            # Feature flags from global config
            - name: ENABLE_OPAQUE_IDS
              value: {{ .Values.global.features.opaqueIds.enabled | quote }}
            - name: ENABLE_AUTHZ
              value: {{ .Values.global.features.authz.enabled | quote }}
            - name: ENABLE_AUDIT_LOGGING
              value: {{ .Values.global.features.auditLogging.enabled | quote }}
            {{- if .Values.global.features.opaqueIds.autoGenerateKey }}
            # OPAQUE_ID_ENCRYPTION_KEY from auto-generated secret
            - name: OPAQUE_ID_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-creds
                  key: OPAQUE_ID_ENCRYPTION_KEY
            {{- end }}
            {{- if .Values.global.features.authz.enabled }}
            # Authorization configuration from global config
            - name: AUTH_EMAIL_HEADER
              value: {{ .Values.global.features.authz.emailHeader | quote }}
            {{- end }}
            {{- if .Values.backend.env }}
            # Additional environment variables from backend.env
            {{- range .Values.backend.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.backend.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.backend.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.backend.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- if .Values.global.features.opaqueIds.autoGenerateKey }}
      volumes:
        - name: opaque-key-secret
          secret:
            secretName: {{ .Release.Name }}-creds
            items:
              - key: OPAQUE_ID_ENCRYPTION_KEY
                path: OPAQUE_ID_ENCRYPTION_KEY
      {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}