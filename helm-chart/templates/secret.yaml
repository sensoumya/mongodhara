{{- if and .Values.backend.enabled (or .Values.global.features.opaqueIds.autoGenerateKey .Values.global.features.authz.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-creds
  labels:
    {{- include "mongodhara.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
type: Opaque
data: {}
  # OPAQUE_ID_ENCRYPTION_KEY will be populated by keygen hook
  # Authz-related secrets can be added here if needed
{{- end }}